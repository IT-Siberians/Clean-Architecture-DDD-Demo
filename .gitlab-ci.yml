# This file is a template, and might need editing before it works on your project.
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Docker.gitlab-ci.yml

# Build a Docker image with CI/CD and push to the GitLab registry.
# Docker-in-Docker documentation: https://docs.gitlab.com/ee/ci/docker/using_docker_build.html
#
# This template uses one generic job with conditional builds
# for the default branch and all other (MR) branches.
stages:
  - build
  - test
  - containerize
variables:
  CHART_PATH: ./.deploy/Helm/Charts/GradeBookMicroservice
  SOLUTION_NAME: GradeBookMicroservice
  SOLUTION_FOLDER: ./src
  SOLUTION_PATH: $SOLUTION_FOLDER/$SOLUTION_NAME.sln
  DOTNET_IMAGE: mcr.microsoft.com/dotnet/sdk:8.0
  EXECUTABLE_PROJECT_PREFIX: WebHost
  DEFAULT_CHART_FILE_NAME: Chart.yaml
  HELM_IMAGE: alpine/helm
  DOCKER_RUNNER_TAG: docker
  CHART: grade-book-microservice
build:
  stage: build
  image: $DOTNET_IMAGE
  script:
    - dotnet build $SOLUTION_PATH
  tags:
    - $DOCKER_RUNNER_TAG
  rules:
    - if: $CI_COMMIT_BRANCH
      exists:
        - $SOLUTION_PATH

test:
  stage: test
  image: $DOTNET_IMAGE
  script:
    - dotnet test $SOLUTION_PATH
  tags:
    - DOCKER_RUNNER_TAG
  rules:
    - if: $CI_COMMIT_BRANCH
      exists:
        - $SOLUTION_PATH


docker-build:
  # Use the official docker image.
  image: docker:cli
  stage: containerize
  services:
    - docker:dind
  variables:
    DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  # All branches are tagged with $DOCKER_IMAGE_NAME (defaults to commit ref slug)
  # Default branch is also tagged with `latest`
  script:
    - docker build --pull -t "$DOCKER_IMAGE_NAME" --build-arg ProjectPath=$SOLUTION_FOLDER --build-arg SiteName=$SOLUTION_NAME.$EXECUTABLE_PROJECT_PREFIX .
    - docker push "$DOCKER_IMAGE_NAME"
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        docker tag "$DOCKER_IMAGE_NAME" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
  # Run this job in a branch where a Dockerfile exists
  rules:
    - if: $CI_COMMIT_BRANCH
      exists:
        - Dockerfile
  tags:
    - DOCKER_RUNNER_TAG

helm_validate:
  stage: containerize
  image: $HELM_IMAGE
  script:
    - helm dependency build $CHART_PATH
    - helm lint $CHART_PATH
  rules:
    - if: $CI_COMMIT_BRANCH
      exists:
        - $DEFAULT_CHART_FILE_NAME
  tags:
    - $DOCKER_RUNNER_TAG

helm_build:
  image: $HELM_IMAGE
  tags:
    - $DOCKER_RUNNER_TAG
  before_script:
    - >
      helm repo add ${CHART}
      --username ${CI_REGISTRY_USER}
      --password ${CI_REGISTRY_PASSWORD}
      ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/stable

  rules:
    - if: $CI_COMMIT_BRANCH
      exists:
        - $DEFAULT_CHART_FILE_NAME
  script:
    - helm package $CHART
    - helm push $CHART*.tgz $CHART
    

