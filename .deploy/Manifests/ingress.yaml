apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grade-book-microservice-ingress
  namespace: grade-book-microservice
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: "gradebook.ipgolenischev.ru"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: grade-book-microservice-service
                port:
                  number: 80
