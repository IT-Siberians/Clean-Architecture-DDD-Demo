apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ tpl .Values.pvc.name . }}
spec:
  storageClassName: {{ tpl  .Values.storageClass.name  . }}-{{ .Values.storageClass.type }}
  resources:
    requests:
      storage: {{ .Values.postgres.size }}
      
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
