apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ tpl .Values.ingress.name . }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
      - http:
          paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: {{ tpl .Values.service.name . }}
                port:
                  number: {{ .Values.service.port }}
