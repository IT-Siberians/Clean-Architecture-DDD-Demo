apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ tpl .Values.monitor.name . }}
  labels:
    name: {{ tpl .Values.monitor.name . }}
    release: prometheus
spec:
  selector:
    matchLabels:
      app: {{ tpl .Values.service.name . }}
      
  endpoints:
  - port: http
    path: /metrics
      
      