.docker-image-build:
  image: docker:cli
  stage: docker
  services:
    - docker:dind
  variables:
    APPLICATION_PART_NAME: ""
    DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE/$APPLICATION_PART_NAME:$CI_COMMIT_REF_SLUG
    LATEST_APPLICATION_IMAGE_NAME: $CI_REGISTRY_IMAGE/$APPLICATION_PART_NAME:latest
    SITE_NAME: ""
    PROJECT_PATH: ""
    DOCKERFILE_PATH: src/Dockerfile
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build --pull -f "$DOCKERFILE_PATH" -t "$DOCKER_IMAGE_NAME" . --build-arg SiteName="$SITE_NAME" --build-arg ProjectPath="$PROJECT_PATH"
    - docker push "$DOCKER_IMAGE_NAME"
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        docker tag "$DOCKER_IMAGE_NAME" "$LATEST_APPLICATION_IMAGE_NAME"
        docker push "$LATEST_APPLICATION_IMAGE_NAME"
      fi
  after_script:
    - docker logout
  rules:
    - if: $CI_COMMIT_BRANCH
      exists:
        - $DOCKERFILE_PATH
